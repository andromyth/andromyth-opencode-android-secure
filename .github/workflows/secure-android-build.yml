name: Secure Android APK build and scan

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/secure-android-build.yml"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Validate vendored hardened source
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/java/ai/opencode/app/ServerAuth.java
          test -f app/src/main/java/ai/opencode/app/Api.java
          test -f app/src/main/java/ai/opencode/app/ServerService.java
          test ! -e keystore/debug.keystore
          git diff --check

      - name: Prepare APK signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/opencode-signing.p12"
          if [ -n "${ANDROID_SIGNING_KEYSTORE_B64:-}" ]; then
            printf '%s' "$ANDROID_SIGNING_KEYSTORE_B64" | base64 --decode > "$STORE"
            : "${ANDROID_SIGNING_STORE_PASSWORD:?missing store password secret}"
            : "${ANDROID_SIGNING_KEY_ALIAS:?missing key alias secret}"
            : "${ANDROID_SIGNING_KEY_PASSWORD:?missing key password secret}"
            STORE_PASS="$ANDROID_SIGNING_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_SIGNING_KEY_ALIAS"
            KEY_PASS="$ANDROID_SIGNING_KEY_PASSWORD"
          elif [ -f keystore/opencode-signing.p12 ]; then
            # Deterministic sideload key committed to this repo: CI and local
            # builds share it, so updates install in place without uninstall.
            STORE="$PWD/keystore/opencode-signing.p12"
            STORE_PASS="opencode-signing"
            KEY_ALIAS="opencode"
            KEY_PASS="opencode-signing"
          else
            STORE_PASS="$(openssl rand -hex 32)"
            KEY_PASS="$STORE_PASS"
            KEY_ALIAS="opencode-ci"
            keytool -genkeypair -noprompt -keystore "$STORE" -storetype PKCS12 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -dname "CN=OpenCode Android CI, OU=Ephemeral Build, O=Private"
          fi
          {
            echo "OPENCODE_SIGNING_KEYSTORE=$STORE"
            echo "OPENCODE_SIGNING_STORE_PASSWORD=$STORE_PASS"
            echo "OPENCODE_SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "OPENCODE_SIGNING_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Restore and verify bundled native payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          gh release download v0.52.0-p52 --repo turanmertkaraca-bit/opencode-android \
            --pattern 'opencode-p52-v0.52.0-debug.apk' \
            --output upstream-release.apk
          echo "742fd845f589500d6279faaed38d2b9419bfa365c24ad70a8135f266275ca748  upstream-release.apk" | sha256sum -c -
          unzip -l upstream-release.apk | grep -F 'assets/oc_pkg.bin'
          unzip -p upstream-release.apk assets/oc_pkg.bin > app/src/main/assets/oc_pkg.bin
          test -s app/src/main/assets/oc_pkg.bin
          test "$(od -An -tx1 -N2 app/src/main/assets/oc_pkg.bin | tr -d ' \\n')" = "1f8b"
          sha256sum app/src/main/assets/oc_pkg.bin | tee native-payload-SHA256SUMS.txt
          ls -lh app/src/main/assets/oc_pkg.bin
          rm upstream-release.apk

      - name: Run JVM tests (retry transient Robolectric downloads)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "JVM test attempt $attempt/3"
            if gradle testDebugUnitTest --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Test task failed; retrying in $((attempt * 20)) seconds."
              sleep "$((attempt * 20))"
            fi
          done
          echo "JVM tests failed after 3 attempts."
          exit 1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature and record SHA-256
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signing-certificate.txt
          grep -qi 'Signer #1 certificate SHA-256 digest' signing-certificate.txt
          sha256sum "$APK" | tee SHA256SUMS.txt

      - name: Malware scan APK and native payload (ClamAV)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          # Ubuntu may auto-start the freshclam daemon during package installation;
          # stop it so the one-shot updater can own the database/log files.
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam --stdout
          clamscan --infected --alert-broken \
            app/build/outputs/apk/debug/app-debug.apk \
            app/src/main/assets/oc_pkg.bin | tee clamav-scan.txt

      - name: Upload build and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-secure-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
            signing-certificate.txt
            clamav-scan.txt
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
