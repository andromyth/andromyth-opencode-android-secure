name: Secure Android APK build and scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Fetch pinned upstream source and apply hardening
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.52.0-p52 https://github.com/turanmertkaraca-bit/opencode-android.git upstream
          test "$(git -C upstream describe --tags --exact-match)" = "v0.52.0-p52"
          cp scripts/apply_security_hardening.py upstream/apply_security_hardening.py
          cd upstream
          python3 apply_security_hardening.py
          rm apply_security_hardening.py
          git diff --check

      - name: Prepare APK signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/opencode-signing.p12"
          if [ -n "${ANDROID_SIGNING_KEYSTORE_B64:-}" ]; then
            printf '%s' "$ANDROID_SIGNING_KEYSTORE_B64" | base64 --decode > "$STORE"
            : "${ANDROID_SIGNING_STORE_PASSWORD:?missing store password secret}"
            : "${ANDROID_SIGNING_KEY_ALIAS:?missing key alias secret}"
            : "${ANDROID_SIGNING_KEY_PASSWORD:?missing key password secret}"
            STORE_PASS="$ANDROID_SIGNING_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_SIGNING_KEY_ALIAS"
            KEY_PASS="$ANDROID_SIGNING_KEY_PASSWORD"
          else
            STORE_PASS="$(openssl rand -hex 32)"
            KEY_PASS="$STORE_PASS"
            KEY_ALIAS="opencode-ci"
            keytool -genkeypair -noprompt -keystore "$STORE" -storetype PKCS12 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -dname "CN=OpenCode Android CI, OU=Ephemeral Build, O=Private"
          fi
          {
            echo "OPENCODE_SIGNING_KEYSTORE=$STORE"
            echo "OPENCODE_SIGNING_STORE_PASSWORD=$STORE_PASS"
            echo "OPENCODE_SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "OPENCODE_SIGNING_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Restore and verify bundled native payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upstream/app/src/main/assets
          gh release download --repo turanmertkaraca-bit/opencode-android \
            --pattern 'opencode-linux-arm64-android.tar.gz' \
            --output upstream/app/src/main/assets/oc_pkg.bin
          echo "6384e745af0ee988a6f51e8aa205c0d71b614e0bb100d22c4e535b355d673a7d  upstream/app/src/main/assets/oc_pkg.bin" | sha256sum -c -
          test "$(od -An -tx1 -N2 upstream/app/src/main/assets/oc_pkg.bin | tr -d ' \n')" = "1f8b"
          ls -lh upstream/app/src/main/assets/oc_pkg.bin

      - name: Run JVM tests
        working-directory: upstream
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: upstream
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature and record SHA-256
        working-directory: upstream
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signing-certificate.txt
          grep -qi 'Signer #1 certificate SHA-256 digest' signing-certificate.txt
          sha256sum "$APK" | tee SHA256SUMS.txt

      - name: Malware scan APK and native payload (ClamAV)
        working-directory: upstream
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo freshclam
          clamscan --infected --alert-broken \
            app/build/outputs/apk/debug/app-debug.apk \
            app/src/main/assets/oc_pkg.bin | tee clamav-scan.txt

      - name: Upload build and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-secure-build
          path: |
            upstream/app/build/outputs/apk/debug/app-debug.apk
            upstream/SHA256SUMS.txt
            upstream/signing-certificate.txt
            upstream/clamav-scan.txt
            upstream/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
