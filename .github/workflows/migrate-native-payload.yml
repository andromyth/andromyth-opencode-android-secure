name: One-time migration of native payload to this repository

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-native-payload.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standalone-payload-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify the pinned upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.52.0-p52 \
            --repo turanmertkaraca-bit/opencode-android \
            --pattern 'opencode-p52-v0.52.0-debug.apk' \
            --output upstream-release.apk
          echo "742fd845f589500d6279faaed38d2b9419bfa365c24ad70a8135f266275ca748  upstream-release.apk" | sha256sum -c -

      - name: Extract and verify the exact native payload
        run: |
          set -euo pipefail
          unzip -p upstream-release.apk assets/oc_pkg.bin > oc_pkg.bin
          test -s oc_pkg.bin
          test "$(od -An -tx1 -N2 oc_pkg.bin | tr -d ' \\n')" = "1f8b"
          echo "6384e745af0ee988a6f51e8aa205c0d71b614e0bb100d22c4e535b355d673a7d  oc_pkg.bin" | sha256sum -c -
          sha256sum oc_pkg.bin

      - name: Publish payload under this repository's ownership
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="standalone-payload-v1"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Standalone OpenCode native payload" \
              --notes "Verified native runtime payload migrated into this repository. This release is owned by $GITHUB_REPOSITORY."
          fi
          gh release upload "$TAG" oc_pkg.bin --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
