name: Build official OpenCode Android ARM64 source APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-source-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-changes:
    runs-on: ubuntu-24.04
    outputs:
      android_source_changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect official runtime source changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_BASE_REF:-}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -Eq '^(scripts/port_official_android\.py|OFFICIAL_ANDROID_BUILD\.json|UPSTREAM_POLICY\.json|\.github/workflows/official-source-android\.yml|app/src/main/java/ai/opencode/app/Binaries\.java)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  source-build:
    name: source-build
    needs: source-changes
    if: needs.source-changes.outputs.android_source_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Android application
        uses: actions/checkout@v4

      - name: Enforce approved source and tool policy
        run: python3 scripts/verify_upstream_policy.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;27.2.12479018"

      - name: Install pinned Bun compiler/runtime
        run: |
          set -euo pipefail
          npm install --global bun@1.4.4
          test "$(bun --version)" = "1.4.4"

      - name: Fetch only pinned official source repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENGINE="$RUNNER_TEMP/opencode"
          TUI="$RUNNER_TEMP/opentui"
          git clone --filter=blob:none https://github.com/anomalyco/opencode.git "$ENGINE"
          git -C "$ENGINE" checkout --detach b958fc84d73e34a2fa021c285cd38c6de674adb9
          git clone --filter=blob:none https://github.com/anomalyco/opentui.git "$TUI"
          git -C "$TUI" checkout --detach ff939592dc7bd102a4665bf340c4960b868b306b
          test "$(git -C "$ENGINE" remote get-url origin)" = "https://github.com/anomalyco/opencode.git"
          test "$(git -C "$TUI" remote get-url origin)" = "https://github.com/anomalyco/opentui.git"
          test "$(git -C "$ENGINE" rev-parse HEAD)" = "b958fc84d73e34a2fa021c285cd38c6de674adb9"
          test "$(git -C "$TUI" rev-parse HEAD)" = "ff939592dc7bd102a4665bf340c4960b868b306b"
          {
            echo "OPENCODE_SOURCE=$ENGINE"
            echo "OPENTUI_SOURCE=$TUI"
          } >> "$GITHUB_ENV"

      - name: Apply reviewed Android/Bionic portability layer
        run: |
          set -euo pipefail
          python3 scripts/port_official_android.py \
            --opencode "$OPENCODE_SOURCE" \
            --opentui "$OPENTUI_SOURCE"
          grep -q 'aarch64-linux-android.28' "$OPENTUI_SOURCE/packages/native/build.zig"
          grep -q 'target == "aarch64-linux-android"' "$OPENCODE_SOURCE/packages/process-daemon/build.rs"

      - name: Set up Zig for official OpenCode PTY daemon
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f
        with:
          version: "0.16.0"
          use-cache: false

      - name: Install Rust Android target
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal --target aarch64-linux-android

      - name: Configure Android NDK and Zig libc
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK="$SDK_ROOT/ndk/27.2.12479018"
          test -d "$NDK"
          HOST_TAG="linux-x86_64"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/$HOST_TAG"
          SYSROOT="$TOOLCHAIN/sysroot"
          ANDROID_LIB="$SYSROOT/usr/lib/aarch64-linux-android/28"
          test -d "$SYSROOT/usr/include"
          test -d "$ANDROID_LIB"
          cat > "$RUNNER_TEMP/android-libc.txt" <<EOF
          include_dir=$SYSROOT/usr/include
          sys_include_dir=$SYSROOT/usr/include/aarch64-linux-android
          crt_dir=$ANDROID_LIB
          msvc_lib_dir=
          kernel32_lib_dir=
          gcc_dir=$ANDROID_LIB
          darwin_sdk_dir=
          EOF
          {
            echo "ANDROID_NDK=$NDK"
            echo "ANDROID_TOOLCHAIN=$TOOLCHAIN"
            echo "ZIG_LIBC=$RUNNER_TEMP/android-libc.txt"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android28-clang"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$TOOLCHAIN/bin/llvm-ar"
            echo "CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android28-clang"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar"
            echo "CXX_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android28-clang++"
            echo "OPENCODE_ZIG_CPU=baseline"
          } >> "$GITHUB_ENV"

      - name: Build official OpenCode PTY daemon for Android ARM64
        working-directory: ${{ runner.temp }}/opencode/packages/process-daemon
        env:
          ZIG_LIBC: ${{ runner.temp }}/android-libc.txt
        run: |
          set -euo pipefail
          chmod +x script/release-bin/zig
          export OPENCODE_REAL_ZIG="$(command -v zig)"
          export PATH="$PWD/script/release-bin:$PATH"
          cargo +1.90.0 build --locked --release --target aarch64-linux-android
          PTY="$PWD/target/aarch64-linux-android/release/opencode-pty"
          test -s "$PTY"
          readelf -h "$PTY" | grep -q 'AArch64'
          readelf -l "$PTY" | grep -q '/system/bin/linker64'
          sha256sum "$PTY" | tee "$RUNNER_TEMP/pty.sha256"
          echo "OPENCODE_PTY_BIN=$PTY" >> "$GITHUB_ENV"

      - name: Set up Zig for official OpenTUI native renderer
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f
        with:
          version: "0.17.1"
          use-cache: false

      - name: Build official OpenTUI Android ARM64 native renderer
        working-directory: ${{ runner.temp }}/opentui/packages/native
        env:
          ZIG_LIBC: ${{ runner.temp }}/android-libc.txt
        run: |
          set -euo pipefail
          sh scripts/prepare-zig-deps.sh
          zig build -Dlibrary-target=aarch64-linux-android.28 -Doptimize=ReleaseFast -Dvideo=false
          LIB="$PWD/lib/aarch64-android/libopentui.so"
          test -s "$LIB"
          readelf -h "$LIB" | grep -q 'AArch64'
          readelf -d "$LIB" >/dev/null
          sha256sum "$LIB" | tee "$RUNNER_TEMP/opentui.sha256"
          echo "OPENTUI_ANDROID_LIB=$LIB" >> "$GITHUB_ENV"

      - name: Install official OpenCode dependencies
        working-directory: ${{ runner.temp }}/opencode
        run: |
          set -euo pipefail
          bun install --os="*" --cpu="*" --libc="*"
          test -d node_modules

      - name: Build official OpenCode CLI for Android ARM64
        working-directory: ${{ runner.temp }}/opencode
        env:
          GH_TOKEN: ${{ github.token }}
          BUN_COMPILE_RELEASE: bun-v1.4.4
          OPENCODE_TARGET: android-arm64
          OPENCODE_PTY_BIN: ${{ runner.temp }}/opencode/packages/process-daemon/target/aarch64-linux-android/release/opencode-pty
        run: |
          set -euo pipefail
          bun run --cwd packages/cli script/build.ts --skip-install
          CLI="$PWD/packages/cli/dist/cli-android-arm64/bin/opencode"
          test -s "$CLI"
          readelf -h "$CLI" | grep -q 'AArch64'
          readelf -l "$CLI" | grep -q '/system/bin/linker64'
          sha256sum "$CLI" | tee "$RUNNER_TEMP/opencode.sha256"
          echo "OPENCODE_ANDROID_CLI=$CLI" >> "$GITHUB_ENV"

      - name: Verify Android FFF native dependency is present
        working-directory: ${{ runner.temp }}/opencode
        run: |
          set -euo pipefail
          FFF="$(find packages node_modules -path '*/@ff-labs/fff-bin-android-arm64/libfff_c.so' -type f -print -quit)"
          test -n "$FFF" && test -s "$FFF"
          readelf -h "$FFF" | grep -q 'AArch64'
          sha256sum "$FFF" | tee "$RUNNER_TEMP/fff.sha256"
          echo "FFF_ANDROID_LIB=$FFF" >> "$GITHUB_ENV"
          LIBCXX="$ANDROID_TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -s "$LIBCXX"
          readelf -h "$LIBCXX" | grep -q 'AArch64'
          sha256sum "$LIBCXX" | tee "$RUNNER_TEMP/libcxx.sha256"
          echo "ANDROID_LIBCXX=$LIBCXX" >> "$GITHUB_ENV"

      - name: Package source-built Android runtime
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/opencode-android-bundle"
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE/lib" "$BUNDLE/bin"
          cp "$OPENCODE_ANDROID_CLI" "$BUNDLE/opencode"
          cp "$OPENCODE_PTY_BIN" "$BUNDLE/bin/opencode-pty"
          cp "$OPENTUI_ANDROID_LIB" "$BUNDLE/lib/libopentui.so"
          cp "$FFF_ANDROID_LIB" "$BUNDLE/lib/libfff_c.so"
          cp "$ANDROID_LIBCXX" "$BUNDLE/lib/libc++_shared.so"
          cat > "$BUNDLE/BUILD_PROVENANCE.json" <<EOF
          {
            "application": "andromyth/andromyth-opencode-android-secure",
            "engine_repository": "anomalyco/opencode",
            "engine_commit": "b958fc84d73e34a2fa021c285cd38c6de674adb9",
            "opentui_repository": "anomalyco/opentui",
            "opentui_commit": "ff939592dc7bd102a4665bf340c4960b868b306b",
            "pty_source": "anomalyco/opencode/packages/process-daemon",
            "ghostty_commit": "ab0b9da9e88fcb4b0533a1854e84628f663930af",
            "bun_release": "bun-v1.4.4",
            "rust": "1.90.0",
            "zig_for_pty": "0.16.0",
            "zig_for_opentui": "0.17.1",
            "target": "aarch64-linux-android",
            "android_api": 28,
            "android_ndk": "27.2.12479018"
          }
          EOF
          mkdir -p app/src/main/assets
          tar -C "$BUNDLE" -czf app/src/main/assets/oc_pkg.bin .
          test -s app/src/main/assets/oc_pkg.bin
          sha256sum app/src/main/assets/oc_pkg.bin | tee runtime-SHA256SUMS.txt
          ls -lh app/src/main/assets/oc_pkg.bin

      - name: Run Android application JVM regression tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK with official-source runtime
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature, ABI and runtime asset
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signing-certificate.txt
          grep -qi 'Signer #1 certificate SHA-256 digest' signing-certificate.txt
          unzip -p "$APK" assets/oc_pkg.bin > "$RUNNER_TEMP/apk-runtime.bin"
          cmp app/src/main/assets/oc_pkg.bin "$RUNNER_TEMP/apk-runtime.bin"
          file "$OPENCODE_ANDROID_CLI"
          file "$OPENCODE_PTY_BIN"
          file "$OPENTUI_ANDROID_LIB"
          sha256sum "$APK" | tee APK-SHA256SUMS.txt
          sha256sum app/src/main/assets/oc_pkg.bin | tee -a APK-SHA256SUMS.txt

      - name: Upload official-source APK and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-official-source-arm64
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/src/main/assets/oc_pkg.bin
            runtime-SHA256SUMS.txt
            APK-SHA256SUMS.txt
            signing-certificate.txt
            ${{ runner.temp }}/opencode-android-bundle/BUILD_PROVENANCE.json
            ${{ runner.temp }}/pty.sha256
            ${{ runner.temp }}/opentui.sha256
            ${{ runner.temp }}/opencode.sha256
            ${{ runner.temp }}/fff.sha256
            ${{ runner.temp }}/libcxx.sha256
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
