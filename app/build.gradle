plugins { id 'com.android.application' }

// Never use a signing key committed to source control.
def ciStore = System.getenv('OPENCODE_SIGNING_KEYSTORE')
def ciStorePassword = System.getenv('OPENCODE_SIGNING_STORE_PASSWORD')
def ciAlias = System.getenv('OPENCODE_SIGNING_KEY_ALIAS')
def ciKeyPassword = System.getenv('OPENCODE_SIGNING_KEY_PASSWORD')
def ciSigningReady = ciStore && ciStorePassword && ciAlias && ciKeyPassword

android {
    namespace 'ai.opencode.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.opencode.app'
        minSdk 28
        // targetSdk 28 stays DELIBERATE — same Termux exec trick the P0
        // probe VERIFIED on-device (API 36, 1412ms, exit 0). Raising targetSdk
        // would move us into the W^X-restricted SELinux domain and break
        // exec() of the opencode binary from app-private storage.
        targetSdk 28
        versionCode 58
        versionName '0.52.0-p55'
    }

    signingConfigs {
        if (ciSigningReady) {
            hardened {
                storeFile file(ciStore)
                storePassword ciStorePassword
                keyAlias ciAlias
                keyPassword ciKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (ciSigningReady) signingConfig signingConfigs.hardened
        }
        release {
            minifyEnabled false
            if (ciSigningReady) signingConfig signingConfigs.hardened
        }
    }

    // P6: the bundled opencode package (asset oc_pkg.bin, ~60 MB tar.gz) must
    // be STORED, not recompressed — and the .bin suffix keeps aapt2 from
    // "helpfully" decompressing + renaming it (the P3a rootfs.tar.gz lesson).
    androidResources {
        noCompress += ['bin']
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // P10: JVM-test-only (Robolectric) self-test harness — see below.
    testOptions {
        unitTests {
            includeAndroidResources true
            all { it.maxHeapSize = '1024m' }
        }
    }
}

// Zero RUNTIME dependencies: 100% framework views/APIs (no androidx).
// Same constraint as the P0 probe — build speed, reproducibility, and no
// external artifact chain.
//
// P10: testImplementation deps power the self-test harness: real view
// rendering to PNG screenshots + a live HTTP round-trip test of the
// permission-reply flow against a mock opencode server. Never shipped.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
